<!doctype html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RIX PRINTING</title>
<meta property="og:title" content="RIX PRINTING">
<meta name="description" content="بەخێربێیت بۆ چاپخانەی ریکس">
<meta name="theme-color" content="#CFFAFE">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;600;700&family=Noto+Kufi+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}html,body{min-height:100%}
body{font-family:'Noto Kufi Arabic', 'Noto Kufi Arabic', system-ui, sans-serif;color:#111827;background:#CFFAFE;background-attachment:fixed;min-height:100vh;-webkit-font-smoothing:antialiased}
.bgm{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}
.bgo{position:fixed;inset:0;background:rgba(0,0,0,0.104);z-index:-1}
.wrap{max-width:560px;margin:0 auto;padding:34px 20px 28px;display:flex;flex-direction:column;align-items:center;min-height:100vh}
.logo{width:112px;height:112px;object-fit:contain;;margin-top:10px}
.title{font-size:30px;font-weight:700;margin-top:16px;text-align:center;letter-spacing:.5px}
.line{width:76px;height:2px;background:#111827;opacity:.45;margin:16px 0 6px;border-radius:2px}
.bio{font-size:15px;opacity:.9;text-align:center;line-height:1.8;max-width:420px;margin-top:8px;white-space:pre-line}
.links{width:100%;margin-top:26px;display:flex;flex-direction:column;gap:18px}
.btn{background:rgba(255,255,255,.16);color:#111827;border:1px solid rgba(255,255,255,.38);border-radius:18px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;align-items:center;min-height:68px;padding:8px 14px;text-decoration:none;font-size:18px;font-weight:600;position:relative;transition:transform .12s ease,box-shadow .12s ease;opacity:0;animation:up .45s ease forwards}
.btn:active{transform:scale(.98);}
.btn:hover{filter:brightness(1.03)}
.btn .t{flex:1;text-align:center;padding:0 10px}
.btn .sp{width:46px;flex:none}
.ic{width:46px;height:46px;flex:none;display:flex;align-items:center;justify-content:center}
.ic svg{width:28px;height:28px}
.ic.circle{border-radius:50%}
.ic.circle svg{width:26px;height:26px}
.insta{background:radial-gradient(circle at 30% 107%,#fdf497 0%,#fdf497 5%,#fd5949 45%,#d6249f 60%,#285AEB 90%)}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.sld{position:relative;width:100%;margin-top:22px;border-radius:18px;overflow:hidden;box-shadow:0 8px 26px rgba(0,0,0,.18);background:rgba(0,0,0,.08)}
.trk{display:flex;width:100%;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.trk::-webkit-scrollbar{display:none}
.trk img{flex:0 0 100%;width:100%;height:100%;object-fit:cover;scroll-snap-align:center;display:block}
.dts{position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:center;gap:7px}
.dts i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.55);box-shadow:0 0 3px rgba(0,0,0,.4);cursor:pointer;transition:all .25s}
.dts i.on{width:22px;border-radius:5px;background:#fff}
.share{position:fixed;top:16px;left:16px;width:46px;height:46px;border-radius:14px;border:0;background:rgba(0,0,0,.28);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(6px)}
.share svg{width:22px;height:22px}
.foot{margin-top:auto;padding-top:34px;font-size:13px;opacity:.8;text-align:center;line-height:1.9}
.foot a{color:inherit}
.wa{position:fixed;bottom:22px;left:22px;width:62px;height:62px;border-radius:50%;background:#25D366;border:3px solid #1DA851;box-shadow:0 6px 18px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:20;animation:pop .5s .4s ease both}
.wa svg{width:34px;height:34px}
.wa:active{transform:scale(.94)}
.wa::after{content:'';position:absolute;inset:-3px;border-radius:50%;border:3px solid #25D366;animation:ring 2.2s 1s ease-out infinite}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes ring{from{opacity:.7;transform:scale(1)}to{opacity:0;transform:scale(1.6)}}
.wrap{padding-bottom:124px}
.wam{position:fixed;bottom:96px;left:18px;display:none;flex-direction:column;gap:10px;z-index:21;animation:up .25s ease}
.wam.open{display:flex}
.wam a{display:flex;align-items:center;gap:10px;background:#fff;color:#111;text-decoration:none;padding:10px 16px 10px 12px;border-radius:999px;box-shadow:0 6px 18px rgba(0,0,0,.25);font-weight:600;font-size:15px;direction:rtl}
.wam a .d{width:34px;height:34px;border-radius:50%;background:#25D366;display:flex;align-items:center;justify-content:center;flex:none}
.wam a .d svg{width:20px;height:20px}
.wam a small{display:block;font-weight:400;opacity:.65;direction:ltr;text-align:right}
.links{display:grid;grid-template-columns:repeat(3,1fr);gap:8.4px}
.btn{flex-direction:column;justify-content:center;gap:7px;aspect-ratio:1/1;min-height:0;padding:7px;font-size:9.1px;text-align:center}
.btn .t{flex:none;padding:0;line-height:1.35;overflow-wrap:anywhere}
.btn .sp{display:none}
.btn .ic,.btn .ic.circle{width:32.2px;height:32.2px}
.btn .ic svg,.btn .ic.circle svg{width:18.2px;height:18.2px}
.logo{width:auto;height:auto;max-width:min(212.5px,90%);max-height:140px}
.title{font-size:18px}
.bio{font-size:16.5px}
.wrap{padding-top:6.8px}
.logo{margin-top:2px}
.title{margin-top:3.2px;line-height:1.25}
.line{margin:3.2px 0 1.2px}
.bio{margin-top:1.6px}
.links{margin-top:5.2px}
</style>
</head>
